name: Visual checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run validate
      - run: node tools/validate-theme-packages.mjs
      - run: npm run check:publish
      - run: npm run build
