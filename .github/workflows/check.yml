name: Visual checks

# PRs from forks are untrusted code. They are checked by pr-package-check.yml
# using a trusted base checkout; this workflow only runs for trusted pushes.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.15.0'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run validate
      - run: node tools/validate-theme-packages.mjs
      - run: npm run check:publish
      - run: npm run build
