<!doctype html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>人物模型对照</title></head>
<body><header><a href="/">返回公司</a><h1>人物模型对照</h1><select aria-label="选择人物" id="character"><option value="shuai">帅帅 · 游戏使用中</option><option value="shuai-alpha">新图重建 · 静态候选</option><option value="nurse">护士 · 游戏使用中</option></select></header>
